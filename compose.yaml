name: nhatduysgn-app
services:
  app:
    build: ./docker/php
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./:/var/www/html
      - ${LEGACY_WEBROOT_HOST:-../nhatduysgn.com/app/webroot}:/legacy-webroot:ro
      - ${LEGACY_TBN_WEBROOT_HOST:-../thietbinongong.com/public_html/app/webroot}:/legacy-webroot-tbn:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.6
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: nhatduy
      MARIADB_USER: nhatduy
      MARIADB_PASSWORD: nhatduy
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mariadb/01-legacy.sh:/docker-entrypoint-initdb.d/01-legacy.sh:ro
      - ${LEGACY_SQL_HOST:-../nhatduysgn.com/nha9921a_nhatduy.sql}:/legacy/dump.sql:ro
      - ./docker/mariadb/02-legacy-tbn.sh:/docker-entrypoint-initdb.d/02-legacy-tbn.sh:ro
      - ${LEGACY_TBN_SQL_HOST:-../thietbinongong.com/nha9921a_tbnongong.sql}:/legacy/tbn.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8026:8025"

volumes:
  db_data:
